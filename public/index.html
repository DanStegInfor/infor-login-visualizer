<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infor Login Events — Global Activity</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Login Events — Global Activity</h1>
    </div>
    <div class="controls">
      <div class="period-group" id="periodGroup" role="group" aria-label="Time period">
        <button data-period="1h">1h</button>
        <button data-period="6h">6h</button>
        <button data-period="24h" class="active">24h</button>
        <button data-period="7d">7d</button>
        <button data-period="30d">30d</button>
      </div>
      <label class="user-filter">
        <span>User</span>
        <select id="userSelect" aria-label="Filter by user">
          <option value="">All users</option>
        </select>
      </label>
      <button id="refreshBtn" class="refresh" title="Refresh">↻</button>
    </div>
  </header>

  <main>
    <section class="kpis" id="kpis" aria-live="polite"></section>

    <section class="grid">
      <div class="card map-card">
        <div class="card-head"><h2>Login locations</h2><span id="mapMeta" class="meta"></span></div>
        <div id="map"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Logins over time</h2></div>
        <div id="timeline" class="chart"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Top countries</h2></div>
        <div id="countries" class="chart bars"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Top users</h2></div>
        <div id="topUsers" class="chart bars"></div>
      </div>

      <div class="card wide">
        <div class="card-head"><h2>Recent events</h2><span id="tableMeta" class="meta"></span></div>
        <div class="table-wrap">
          <table id="eventsTable">
            <thead>
              <tr><th>Time (UTC)</th><th>Action</th><th>User</th><th>City</th><th>Country</th><th>IP</th><th>Session</th><th>MFA</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="status" class="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
